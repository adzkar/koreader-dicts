id = "en-ca"
source_lang = "en"
target_lang = "ca"
tier = 1
name = "English to Catalan"
bookname = "en-ca"
basename = "en-ca"
description = """\
English to Catalan, built by pivoting Princeton WordNet 3.0 through \
the Catalan wordnet and enriching with the English Wiktionary. Includes an \
inflection index."""

[pivot]
source_side = "pwn30"
target_side = "omw-ca"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = true
max_translations = 5

[[enrich]]
source = "wikt-en-ca"
add_new_headwords = true

[inflections]
wordnet_exceptions = "pwn30"
rules = true
from_sources = ["wikt-en-ca"]

[benchmark]
frequency_list = "freq/en_50k.txt"
frequency_list_name = "OpenSubtitles 2018 English top 50k (hermitdave/FrequencyWords)"
