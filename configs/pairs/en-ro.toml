id = "en-ro"
source_lang = "en"
target_lang = "ro"
tier = 1
name = "English to Romanian"
bookname = "en-ro"
basename = "en-ro"
description = """\
English to Romanian, built by pivoting Princeton WordNet 3.0 through \
the Romanian Wordnet and enriching with the English Wiktionary. Includes an \
inflection index."""

[pivot]
source_side = "pwn30"
target_side = "omw-ro"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = true
max_translations = 5

[[enrich]]
source = "wikt-en-ro"
add_new_headwords = true

[inflections]
wordnet_exceptions = "pwn30"
rules = true
from_sources = ["wikt-en-ro"]

[benchmark]
frequency_list = "freq/en_50k.txt"
frequency_list_name = "OpenSubtitles 2018 English top 50k (hermitdave/FrequencyWords)"
