id = "ro-en"
source_lang = "ro"
target_lang = "en"
tier = 4
name = "Romanian to English"
bookname = "ro-en"
basename = "ro-en"
description = """\
Romanian to English, generated by inverting the WordNet pivot and \
enriched with the Romanian section of the English Wiktionary. Includes an \
inflection index."""

[pivot]
source_side = "omw-ro"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

[[enrich]]
source = "wikt-ro-en"
add_new_headwords = true

[inflections]
from_sources = ["wikt-ro-en"]

[benchmark]
frequency_list = "freq/ro_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Romanian top 50k (hermitdave/FrequencyWords)"
