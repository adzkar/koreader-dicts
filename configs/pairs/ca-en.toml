id = "ca-en"
source_lang = "ca"
target_lang = "en"
tier = 4
name = "Catalan to English"
bookname = "ca-en"
basename = "ca-en"
description = """\
Catalan to English, generated by inverting the WordNet pivot and \
enriched with the Catalan section of the English Wiktionary. Includes an \
inflection index."""

[pivot]
source_side = "omw-ca"
target_side = "pwn30"
gloss_providers = ["pwn30"]
gloss_langs = ["en"]
keep_gloss_only = false
max_translations = 5

[[enrich]]
source = "wikt-ca-en"
add_new_headwords = true

[inflections]
from_sources = ["wikt-ca-en"]

[benchmark]
frequency_list = "freq/ca_50k.txt"
frequency_list_name = "OpenSubtitles 2018 Catalan top 50k (hermitdave/FrequencyWords)"
